services:
  postgres:
    container_name: postgres-sql-bsn
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: sb_ng_fr
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - spring-demo
    restart: unless-stopped
  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
  keycloak:
    container_name: keycloak-bsn
    image: quay.io/keycloak/keycloak:26.1.3
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - spring-demo
    command:
      - "start-dev"
  sbngfr-api:
    container_name: sbngfr-api
    image: sbngfr/sbngfr:1.0.2
    ports:
      - 8088:8088
    networks:
      - spring-demo
    depends_on:
      - postgres

  sbngfr-ui:
    container_name: sbngfr-ui
    image: sbngfr/sbngfr-ui:1.0.0
    ports:
      - 8080:80
    networks:
      - spring-demo
    depends_on:
      - sbngfr-api

networks:
  spring-demo:
    driver: bridge

volumes:
  postgres:
    driver: local