spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sb_ng_fr
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 1025
    username: "username"
    password: "password"
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
application:
  security:
    jwt:
      secret-key: 04e614dc57e90596252ab9bcf3e436e190d9ab0bf9dc43358f8a739c0671cfcd
      expiration: 8640000
  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account
  frontend-dev-url: http://localhost:4200
server:
  port: 8088